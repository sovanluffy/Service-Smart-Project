version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: smart-services-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Specifically setting these so Postgres initializes correctly
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rental:
    build: .
    container_name: smart-services-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT}:8080"
    env_file:
      - .env
    # DB_HOST=postgres tells the app to look for the container named 'postgres'
    environment:
      - DB_HOST=postgres
    volumes:
      - ./${FILE_UPLOAD_DIR}:/app/${FILE_UPLOAD_DIR}

volumes:
  postgres_data: