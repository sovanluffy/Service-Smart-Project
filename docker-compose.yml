version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: smart-services-postgres
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432"   # fix port mapping
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rental:
    build: .
    container_name: smart-services-app
    env_file:
      - .env
    ports:
      - "${APP_PORT}:8080"
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
