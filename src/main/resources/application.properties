# ==============================
# App
# ==============================
spring.application.name=ServiceBooking
server.port=${APP_PORT:8080}

# ==============================
# Database (NeonDB)
# ==============================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}&channelBinding=${DB_CHANNEL_BINDING}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==============================
# JWT
# ==============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Fix for "Failed to load remote configuration"
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# This ensures the config-url matches the whitelisted path
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

# ==============================
# File Upload
# ==============================
file.upload-dir=${FILE_UPLOAD_DIR}
