spring.application.name=ServiceBooking
# Datasource (PostgreSQL)
# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSLMODE}&channel_binding=${DB_CHANNEL_BINDING}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File upload directory
file.upload-dir=${FILE_UPLOAD_DIR}

# JWT configuration
jwt.secret=${SPRING_JWT_SECRET}
jwt.expiration=${SPRING_JWT_EXPIRE}
